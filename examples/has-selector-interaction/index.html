<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>:has() Interaction</title><link rel="stylesheet" href="style.css"></head><body><main class="page"><header><span>:has()</span><h1>Style the parent from a child state.</h1><p>Select a theme below. The wrapper changes because it contains the checked input.</p><a href="../../">Back to lab</a></header><section class="demo"><div class="preview"><span>Live preview</span><h2>No JavaScript state needed.</h2><p>The parent reacts to whichever radio input is checked.</p></div><form><label><input type="radio" name="theme" value="violet" checked><span>Violet</span></label><label><input type="radio" name="theme" value="mint"><span>Mint</span></label><label><input type="radio" name="theme" value="sunset"><span>Sunset</span></label></form></section></main></body></html>
