<body>

<nav class="dots" aria-label="Section navigation"><button data-go="0" aria-label="Go to section one">1</button><button data-go="1" aria-label="Go to section two">2</button><button data-go="2" aria-label="Go to section three">3</button></nav>
<main class="snap">
  <section class="slide s1"><span>15 / 01</span><h1>Enter<br>the field.</h1><div class="shape"></div></section>
  <section class="slide s2"><span>15 / 02</span><h1>Change<br>the tempo.</h1><div class="shape"></div></section>
  <section class="slide s3"><span>15 / 03</span><h1>Leave<br>a mark.</h1><div class="shape"></div></section>
</main>
<script src="script.js"></script>
